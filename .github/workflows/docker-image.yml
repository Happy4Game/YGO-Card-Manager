name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ygo-card-manager:$(date +%s)
  run:
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
    - name: Run the docker image
      run: docker run -d -p 80:80 --rm --name ygo-front ygo-card-manager
