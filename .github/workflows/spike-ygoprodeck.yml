# Lancement manuel uniquement (onglet Actions > Spike YGOPRODeck > Run workflow).
# Fait 3 requêtes vers l'API pour mesurer CORS et la taille des données.
name: Spike YGOPRODeck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/spike-ygoprodeck.mjs
